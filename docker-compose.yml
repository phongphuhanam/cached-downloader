services:
  cachedownload:
    init: true
    build: .
    environment:
      FLASK_APP: /app/main_app.py
    ports:
      - "7575:5000"
    volumes:
      - ./.cached/:/data/:rw
    restart: unless-stopped

  # Caches apt/.deb packages for Debian-family image builds (e.g.
  # plugins/ohmyzsh/docker_nvim_quickstart's Dockerfile.nvim), so a base-image
  # bump doesn't force full re-downloads from the Debian/Ubuntu mirrors.
  # Optional — only needed if a build points at it.
  apt-cacher-ng:
    image: sameersbn/apt-cacher-ng:latest
    init: true
    ports:
      - "3142:3142"
    volumes:
      - ./.apt-cache/:/var/cache/apt-cacher-ng/:rw
      # Opt-in upstream proxy for apt-cacher-ng's own downloads -- see the
      # file's own comment. Committed empty/commented-out; a host whose
      # network intercepts direct fetches (e.g. a captive portal poisoning
      # the cache with login-page HTML instead of real .deb files) edits
      # its local copy to point at a working proxy, uncommitted, since
      # that's host/network specific, not something every PC needs.
      - ./zz_upstream_proxy.conf:/etc/apt-cacher-ng/zz_upstream_proxy.conf:ro
    restart: unless-stopped
